<!DOCTYPE html> <!-- Tell the browser to interpret this document as modern HTML. -->
<html lang="en"> <!-- Start the HTML document and identify its language as English. -->
<head> <!-- Start the section containing page metadata, styles, and the browser-tab title. -->
  <meta charset="UTF-8"> <!-- Use UTF-8 character encoding to support a wide range of characters. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Match the viewport to the device width and start at normal zoom. -->
  <title>My First Website</title> <!-- Set the text displayed in the browser tab. -->

  <style> /* Start the CSS rules that control the page's appearance. */
    body { /* Apply the following styles to the page body. */
      font-family: Arial, sans-serif; /* Use Arial, or another sans-serif font if Arial is unavailable. */
      margin: 32px; /* Leave 32 pixels of space around the page content. */
      color: #222; /* Set the default text color to dark gray. */
    } /* End the body styles. */

    #chart { /* Select the element whose id is "chart". */
      max-width: 640px; /* Prevent the chart container from becoming wider than 640 pixels. */
    } /* End the chart-container styles. */

    #chart svg { /* Select any SVG drawing inside the chart container. */
      display: block; /* Display the SVG as a block, avoiding inline-element baseline spacing. */
      width: 100%; /* Make the SVG fill the available width of its container. */
      height: auto; /* Calculate its height from its aspect ratio rather than stretching it. */
    } /* End the SVG styles. */

    .bar { /* Select every element with the class "bar". */
      fill: steelblue; /* Color the interior of each SVG bar steel blue. */
    } /* End the default bar styles. */

    .bar:hover { /* Select a bar while the mouse pointer is over it. */
      fill: darkorange; /* Change the hovered bar's interior color to dark orange. */
    } /* End the hover styles. */

    .value-label { /* Select the numeric text labels above the bars. */
      font-size: 14px; /* Set the label text size to 14 pixels. */
      text-anchor: middle; /* Center each SVG text label horizontally on its x coordinate. */
    } /* End the value-label styles. */
  </style> <!-- Finish the CSS section. -->
</head> <!-- Finish the page metadata section. -->
<body> <!-- Start the content displayed on the page. -->
  <h1>Hello World!</h1> <!-- Display the page's main heading. -->
  <p>This is my very first website.</p> <!-- Display a paragraph below the heading. -->

  <h2>My bar chart</h2> <!-- Display a second-level heading for the chart. -->
  <div id="chart"></div> <!-- Create an empty container where D3 will insert the SVG chart. -->

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script> <!-- Load D3 version 7 from a CDN before executing the chart code. -->

  <script> // Start the JavaScript that builds the chart.
    const data = [ // Declare an array containing the chart's four data objects.
      { name: "A", value: 1 }, // Define category A with a numeric value of 1.
      { name: "B", value: 5 }, // Define category B with a numeric value of 5.
      { name: "C", value: 8 }, // Define category C with a numeric value of 8.
      { name: "D", value: 10 } // Define category D with a numeric value of 10.
    ]; // Finish the data array and its declaration.

    const width = 640; // Define the SVG's internal coordinate width as 640 units.
    const height = 400; // Define the SVG's internal coordinate height as 400 units.
    const margin = { top: 30, right: 20, bottom: 40, left: 45 }; // Reserve space around the plotting area for labels and axes.

    const svg = d3.select("#chart") // Select the chart container and begin the chain that creates the SVG.
      .append("svg") // Insert an SVG element inside that container and select the new SVG.
      .attr("viewBox", `0 0 ${width} ${height}`) // Define its internal coordinates and aspect ratio; ${...} inserts variable values.
      .attr("role", "img") // Tell assistive technology to treat the SVG as an image.
      .attr("aria-labelledby", "chart-title chart-description"); // Associate the SVG with the accessible text elements created below.

    svg.append("title") // Add an SVG title element for a short accessible chart name.
      .attr("id", "chart-title") // Give the title the ID referenced by aria-labelledby.
      .text("Values by category"); // Set the title's text content.

    svg.append("desc") // Add an SVG description element with a textual summary.
      .attr("id", "chart-description") // Give the description the ID referenced by aria-labelledby.
      .text("Bar chart: A has value 1, B 5, C 8, and D 10."); // Describe the values for readers who cannot see the chart.

    const x = d3.scaleBand() // Create a categorical scale that allocates an equal-width band to each category.
      .domain(data.map(d => d.name)) // Extract each object's name to set the input categories: A, B, C, and D.
      .range([margin.left, width - margin.right]) // Set the horizontal drawing region from the left margin to the right margin.
      .padding(0.2); // Add proportional spacing between bands and at the edges; this is not a pixel measurement.

    const y = d3.scaleLinear() // Create a scale that maps numeric values to vertical drawing coordinates.
      .domain([0, d3.max(data, d => d.value)]) // Set the input range from zero to the largest value in the data, which is 10.
      .nice() // Extend domain endpoints to convenient rounded values when needed; this domain remains 0–10.
      .range([height - margin.bottom, margin.top]); // Map zero to the bottom and the maximum to the top, since SVG y coordinates increase downward.

    svg.append("g") // Create an SVG group to contain the bars.
      .selectAll("rect") // Select rectangles within this group; initially there are none.
      .data(data) // Bind the four data objects to the rectangle selection.
      .join("rect") // Create missing rectangles, update existing ones, and remove extras to match the data.
      .attr("class", "bar") // Give each rectangle the "bar" class so the CSS rules apply.
      .attr("x", d => x(d.name)) // Position each bar horizontally at the start of its category's band.
      .attr("y", d => y(d.value)) // Position the top of each bar at the coordinate corresponding to its value.
      .attr("width", x.bandwidth()) // Set every bar's width to the width calculated by the band scale.
      .attr("height", d => y(0) - y(d.value)) // Calculate each bar's height as the distance from its top to the zero baseline.
      .append("title") // Add an SVG title inside each rectangle, commonly shown as a hover tooltip.
      .text(d => `${d.name}: ${d.value}`); // Set the tooltip text using that bar's data, such as "B: 5".

    svg.append("g") // Create a separate SVG group for the horizontal axis.
      .attr("transform", `translate(0, ${height - margin.bottom})`) // Move the axis group down to the chart's baseline without shifting it horizontally.
      .call(d3.axisBottom(x)); // Draw an axis using the x scale, with ticks and labels below the baseline.

    svg.append("g") // Create a separate SVG group for the vertical axis.
      .attr("transform", `translate(${margin.left}, 0)`) // Move the axis group right to the plotting area's left edge.
      .call(d3.axisLeft(y).ticks(5).tickFormat(d3.format("d"))); // Draw a left-facing y axis, request roughly five ticks, and format tick labels as integers.

    svg.append("g") // Create a separate SVG group for the numbers above the bars.
      .selectAll("text") // Select text elements in this group; initially there are none.
      .data(data) // Bind the same four data objects to the text selection.
      .join("text") // Create one text element per data object, updating or removing elements if necessary.
      .attr("class", "value-label") // Apply the CSS class that sets the font size and centered alignment.
      .attr("x", d => x(d.name) + x.bandwidth() / 2) // Position each label at the horizontal center of its bar.
      .attr("y", d => y(d.value) - 8) // Position each label's text baseline eight SVG units above the bar's top.
      .text(d => d.value); // Display the numeric value associated with each bar.
  </script> <!-- Finish the chart-building JavaScript. -->
</body> <!-- Finish the visible page content. -->
</html> <!-- Finish the HTML document. -->
